        const mobileMenu = document.getElementById('mobile-menu');

        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Close mobile menu on clicking links
        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });

        // WhatsApp Form integration
        function enviarWhatsApp(event) {
            event.preventDefault();
            
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const servicio = document.getElementById('servicio').value;
            const mensaje = document.getElementById('mensaje').value.trim();

            // Format message
            const texto = `Hola Ing. Robert Santos Salvador,%0A%0AMi nombre es *${encodeURIComponent(nombre)}* (Tel: ${encodeURIComponent(telefono)}).%0A%0AEstoy interesado en el servicio de: *${encodeURIComponent(servicio)}*.%0A%0ADetalles:%0A${encodeURIComponent(mensaje)}`;
            
            // WhatsApp Number (replace with actual number if needed)
            const numeroWhatsApp = "51999999999";
            
            // Open WhatsApp
            window.open(`https://wa.me/${numeroWhatsApp}?text=${texto}`, '_blank');
